<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kas Harian</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>Kas Harian</h1>
      <p class="subtitle">Catatan pemasukan dan pengeluaran sederhana</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Tambah Catatan</h2>
      <form id="form-kas">
        <div class="field">
          <label for="keterangan">Keterangan</label>
          <input type="text" id="keterangan" placeholder="Contoh: Makan siang" required />
        </div>
        <div class="field">
          <label for="jumlah">Jumlah (Rp)</label>
          <input type="number" id="jumlah" placeholder="15000" required />
        </div>
        <div class="field">
          <label for="jenis">Jenis</label>
          <select id="jenis">
            <option value="keluar">Pengeluaran</option>
            <option value="masuk">Pemasukan</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Simpan</button>
      </form>
    </section>

    <section class="card">
      <h2>Daftar Catatan</h2>
      <ul id="daftar-kas" class="list">
        <li class="item">
          <span>Makan siang</span>
          <strong class="keluar">-Rp15.000</strong>
        </li>
        <li class="item">
          <span>Uang saku</span>
          <strong class="masuk">+Rp100.000</strong>
        </li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
